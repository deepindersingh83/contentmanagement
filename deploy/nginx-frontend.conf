# Content Management frontend — serve the built SPA from the dist/ subfolder.
#
# Replace the existing
#     location /contentmanagement/frontend/ { ... }
# block in the HTTPS server { } of app.gamingdesktop.com.au with this one.
#
# Why ^~ : it makes this prefix beat the generic `location ~* \.(css|js|...)$`
# regex, so JS/CSS under /contentmanagement/frontend/ are served from dist/
# (not from the project root). Why alias dist/ : the source index.html stays
# untouched so `npm run build` keeps working; only built output is served.

location ^~ /contentmanagement/frontend/ {
    alias /home/app/htdocs/app.gamingdesktop.com.au/contentmanagement/frontend/dist/;
    try_files $uri $uri/ /contentmanagement/frontend/index.html;
    expires 7d;
}
