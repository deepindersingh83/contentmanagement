# Content Management — API routing for nginx (app.gamingdesktop.com.au)
#
# nginx has no .htaccess equivalent, so this rule must live in the server config.
# To keep it version-controlled, this file is included from the vhost ONCE:
#
#   # inside the HTTPS server { } block of
#   # /etc/nginx/sites-enabled/app.gamingdesktop.com.au.conf
#   include /home/app/htdocs/app.gamingdesktop.com.au/contentmanagement/deploy/nginx-api.conf;
#
# After that, any change here ships via `git pull` + `systemctl reload nginx`
# (no vhost editing needed again).
#
# Routes /api/* straight to the Symfony front controller via the app's PHP-FPM
# pool. SCRIPT_NAME=/index.php + preserved REQUEST_URI make Symfony treat its
# base path as empty, so its /api/... routes still match.

location ^~ /api/ {
    fastcgi_pass 127.0.0.1:19006;            # app.gamingdesktop.com.au PHP-FPM pool
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/app/htdocs/app.gamingdesktop.com.au/contentmanagement/backend/public/index.php;
    fastcgi_param DOCUMENT_ROOT   /home/app/htdocs/app.gamingdesktop.com.au/contentmanagement/backend/public;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param REQUEST_URI     $request_uri;
    fastcgi_param HTTPS           on;
    fastcgi_param SERVER_PORT     443;
    fastcgi_read_timeout 120;
    fastcgi_send_timeout 120;
}
